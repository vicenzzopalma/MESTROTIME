[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chronos-maestro"
version = "1.0.0"
description = "Core orchestration engine for Chronos Maestro"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pydantic>=2.7.0",
]

[project.scripts]
maestro = "maestro.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
